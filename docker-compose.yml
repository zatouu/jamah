# Environnement de développement — Jamah Sayroul Eubeud
# Démarrage : cp .env.example .env && docker compose up -d
name: jamah

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  directus:
    image: directus/directus:11.5.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SECRET: ${DIRECTUS_SECRET}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      WEBSOCKETS_ENABLED: "false"
    volumes:
      - ./data/directus/uploads:/directus/uploads
      - ./cms/extensions:/directus/extensions
    ports:
      - "8055:8055"

  elasticsearch:
    build: ./infra/elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS}
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  search:
    build: ./services/search
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      SEARCH_ES_URL: ${SEARCH_ES_URL}
      SEARCH_INDEX_PREFIX: ${SEARCH_INDEX_PREFIX}
      SEARCH_INDEX_TOKEN: ${SEARCH_INDEX_TOKEN}
    ports:
      - "8000:8000"

  web:
    build: ./apps/web
    restart: unless-stopped
    depends_on:
      - search
      - directus
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      SEARCH_API_URL: http://search:8000
      CMS_URL: http://directus:8055
    ports:
      - "3000:3000"
