name: Deploy

# Après une CI verte sur main (ou à la demande) : image du site -> GHCR, puis mise à jour de la VM par SSH.
# /opt/jamah/.env est réécrit à chaque déploiement depuis l'environnement GitHub « production » (ne pas l'éditer sur la VM).
# Secrets : VM_HOST, VM_USER, VM_SSH_KEY, POSTGRES_PASSWORD, DIRECTUS_SECRET, DIRECTUS_ADMIN_PASSWORD,
#   REVALIDATE_TOKEN, SEARCH_INDEX_TOKEN. POSTGRES_PASSWORD et DIRECTUS_ADMIN_PASSWORD ne servent qu'à
#   l'initialisation : les changer ensuite exige aussi ALTER USER (Postgres) / le changement dans Directus.
# Variables : SITE_URL (https://...), CMS_DOMAIN, ACME_EMAIL, DIRECTUS_ADMIN_EMAIL, VM_KNOWN_HOSTS (ssh-keyscan) ;
#   facultatives : DOCKER_PLATFORM (linux/arm64 pour Graviton), COMPOSE_PROFILES, SEARCH_API_URL,
#   SEARCH_EMBEDDING_MODEL, ES_JAVA_OPTS, LEGACY_SITE_DOMAIN / LEGACY_CMS_DOMAIN (anciennes adresses redirigées).
#   www.<SITE_DOMAIN> est redirigé vers le domaine nu (enregistrement DNS www requis).
# Courriels Directus (Brevo) : secret EMAIL_SMTP_PASSWORD (clé SMTP) + variables EMAIL_SMTP_USER (identifiant SMTP)
#   et EMAIL_FROM (adresse seule, expéditeur déclaré dans Brevo ; le nom affiché est le nom du projet Directus) ; EMAIL_SMTP_HOST / EMAIL_SMTP_PORT facultatifs (smtp-relay.brevo.com:587).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Image du site
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          test -n "$SITE_URL" || { echo "::error::Variable SITE_URL manquante"; exit 1; }
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jamah-web" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Compose de production valide
        run: docker compose -f deploy/compose.prod.yml --env-file deploy/prod.env.example config --quiet
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          platforms: ${{ vars.DOCKER_PLATFORM || 'linux/amd64' }}
          build-args: NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Mise à jour de la VM
    needs: image
    runs-on: ubuntu-latest
    environment: production
    env:
      TARGET: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Accès SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VM_KNOWN_HOSTS || secrets.VM_KNOWN_HOSTS }}
        run: |
          test -n "$KNOWN_HOSTS" || { echo "::error::VM_KNOWN_HOSTS manquant (variable ou secret de l'environnement production)"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' > ~/.ssh/config
      - name: Copie de la configuration
        run: |
          rsync -az --delete --relative --exclude '__pycache__' \
            deploy cms apps/web/src services/search infra "$TARGET:/opt/jamah/"
      - name: Fichier .env
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CMS_DOMAIN: ${{ vars.CMS_DOMAIN }}
          LEGACY_SITE_DOMAIN: ${{ vars.LEGACY_SITE_DOMAIN }}
          LEGACY_CMS_DOMAIN: ${{ vars.LEGACY_CMS_DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          DIRECTUS_ADMIN_EMAIL: ${{ vars.DIRECTUS_ADMIN_EMAIL }}
          COMPOSE_PROFILES: ${{ vars.COMPOSE_PROFILES }}
          SEARCH_API_URL: ${{ vars.SEARCH_API_URL }}
          SEARCH_EMBEDDING_MODEL: ${{ vars.SEARCH_EMBEDDING_MODEL }}
          ES_JAVA_OPTS: ${{ vars.ES_JAVA_OPTS || '-Xms512m -Xmx512m' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DIRECTUS_SECRET: ${{ secrets.DIRECTUS_SECRET }}
          DIRECTUS_ADMIN_PASSWORD: ${{ secrets.DIRECTUS_ADMIN_PASSWORD }}
          REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
          SEARCH_INDEX_TOKEN: ${{ secrets.SEARCH_INDEX_TOKEN }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_SMTP_HOST: ${{ vars.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ vars.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USER: ${{ vars.EMAIL_SMTP_USER }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          WEB_IMAGE: ${{ needs.image.outputs.image }}
          WEB_TAG: ${{ needs.image.outputs.tag }}
        run: |
          SITE_DOMAIN=${SITE_URL#https://}
          SITE_DOMAIN=${SITE_DOMAIN%/}
          POSTGRES_DB=jamah
          POSTGRES_USER=jamah
          required="SITE_DOMAIN CMS_DOMAIN ACME_EMAIL DIRECTUS_ADMIN_EMAIL POSTGRES_PASSWORD DIRECTUS_SECRET DIRECTUS_ADMIN_PASSWORD REVALIDATE_TOKEN SEARCH_INDEX_TOKEN WEB_IMAGE WEB_TAG"
          optional="LEGACY_SITE_DOMAIN LEGACY_CMS_DOMAIN POSTGRES_DB POSTGRES_USER COMPOSE_PROFILES SEARCH_API_URL SEARCH_EMBEDDING_MODEL ES_JAVA_OPTS EMAIL_TRANSPORT EMAIL_FROM EMAIL_SMTP_HOST EMAIL_SMTP_PORT EMAIL_SMTP_USER EMAIL_SMTP_PASSWORD"
          fail=
          [[ "$SITE_URL" == https://* ]] || { echo "::error::SITE_URL doit commencer par https://"; fail=1; }
          # Courriels Directus : SMTP dès que le mot de passe SMTP existe (expéditeur et identifiant alors obligatoires)
          EMAIL_TRANSPORT=
          if [ -n "$EMAIL_SMTP_PASSWORD" ]; then
            EMAIL_TRANSPORT=smtp
            required="$required EMAIL_FROM EMAIL_SMTP_USER"
          else
            echo "::warning::EMAIL_SMTP_PASSWORD absent : Directus n'enverra aucun courriel (invitations, mot de passe oublié)."
          fi
          for k in $required; do
            if [ -z "${!k}" ]; then echo "::error::$k manquant (secret ou variable de l'environnement production)"; fail=1; fi
            if [[ "${!k}" == *example.* || "${!k}" == change-me ]]; then echo "::error::$k a encore sa valeur d'exemple"; fail=1; fi
          done
          for k in $required $optional; do
            if [[ "${!k}" == *[$'\n\r']* || "${!k}" == *"'"* ]]; then echo "::error::$k contient un retour à la ligne ou une apostrophe"; fail=1; fi
          done
          [ -z "$fail" ] || exit 1
          # Valeurs entre apostrophes : Docker Compose ne les interprète pas ($, espaces, #)
          for k in $required $optional; do printf "%s='%s'\n" "$k" "${!k}"; done \
            | ssh "$TARGET" 'umask 077 && cat > /opt/jamah/.env.new && mv /opt/jamah/.env.new /opt/jamah/.env'
      - name: Connexion au registre
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | ssh "$TARGET" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
      - name: Redémarrage des services
        run: |
          ssh "$TARGET" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/jamah
          compose() { docker compose -f deploy/compose.prod.yml --env-file .env "$@"; }
          trap 'docker logout ghcr.io >/dev/null' EXIT
          compose pull web
          compose up -d
          # Directus ne recharge ses extensions qu'au démarrage
          sum=$(find cms/extensions -type f -exec sha256sum {} + | sort | sha256sum)
          if [ "$sum" != "$(cat data/.extensions.sha 2>/dev/null)" ]; then
            compose restart directus
            echo "$sum" > data/.extensions.sha
          fi
          # Caddyfile monté en fichier : rsync le remplace (nouvel inode), seul un redémarrage le relit
          sum=$(sha256sum deploy/Caddyfile)
          if [ "$sum" != "$(cat data/.caddyfile.sha 2>/dev/null)" ]; then
            compose restart caddy
            echo "$sum" > data/.caddyfile.sha
          fi
          check() {
            for i in $(seq 1 20); do
              compose exec -T web wget -qO /dev/null "http://127.0.0.1:3000/$1" && return 0
              sleep 3
            done
            compose logs --tail 50 web; exit 1
          }
          check fr
          # Image construite sans accès au CMS : relire Directus tout de suite
          compose exec -T web sh -c 'wget -qO /dev/null --header="Authorization: Bearer $REVALIDATE_TOKEN" --post-data="" http://127.0.0.1:3000/api/revalidate' \
            || echo "Régénération non effectuée (jeton absent ?) : le site relira Directus sous 5 minutes."
          # Les pages régénérées doivent aussi répondre (ISR écrit dans .next)
          for round in 1 2; do sleep 5; for p in fr ar en fr/awliya; do check "$p"; done; done
          docker image prune -f >/dev/null
          EOF
